<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="devxian96 - 장석현, Full-Stack Engineer at Cafe24. 없으면 만든다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#11161F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#4FD1C5" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect x="0" y="0" width="5" height="360" fill="#4FD1C5"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      <text x="72" y="88" font-size="19" fill="#4FD1C5" fill-opacity="0.75">$ whoami</text>
      <text x="72" y="182" font-size="78" font-weight="700" fill="#E6EDF3" letter-spacing="-2">devxian96</text>
    </g>

    <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif" fill="#8B95A5">
      <text x="76" y="222" font-size="21">장석현 · Seokhyun Jang</text>
      <text x="76" y="252" font-size="17" fill-opacity="0.8">Full-Stack Engineer @ Cafe24 · Gyeonggi-do, Republic of Korea</text>
    </g>

    <line x1="76" y1="286" x2="176" y2="286" stroke="#4FD1C5" stroke-width="2" stroke-opacity="0.6"/>

    <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif">
      <text x="76" y="325" font-size="30" font-weight="700" fill="#4FD1C5">없으면 만든다.</text>
      <text x="290" y="325" font-size="16" fill="#8B95A5" fill-opacity="0.85">If it doesn&#39;t exist, I build it.</text>
