<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="devxian96 - 장석현, Full-Stack Engineer at Cafe24. 없으면 만든다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0E1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#00AAFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#00AAFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00AAFF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#00AAFF" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect x="0" y="0" width="5" height="360" fill="url(#edge)"/>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      <text x="72" y="88" font-size="19" fill="#00AAFF" fill-opacity="0.85">$ whoami</text>
      <text x="72" y="182" font-size="78" font-weight="700" fill="#E9F1F8" letter-spacing="-2">devxian96</text>
    </g>

    <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif" fill="#8A99AC">
      <text x="76" y="222" font-size="21">장석현 · Seokhyun Jang</text>
      <text x="76" y="252" font-size="17" fill-opacity="0.8">Full-Stack Engineer @ Cafe24 · Gyeonggi-do, Republic of Korea</text>
    </g>

    <rect x="76" y="285" width="110" height="2" fill="url(#rule)"/>

    <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, 'Segoe UI', sans-serif">
      <text x="76" y="325" font-size="30" font-weight="700" fill="#00AAFF">없으면 만든다.</text>
      <text x="290" y="325" font-size="16" fill="#8A99AC" fill-opacity="0.85">If it doesn&#39;t exist, I build it.</text>
    </g>
  </g>
</svg>
